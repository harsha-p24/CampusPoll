name: CampusPoll CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          ADMIN_PASSWORD: TestAdmin@123
          SECRET_KEY: ci-test-secret-key
          MAIL_USERNAME: ''
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-fail-under=60

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit==1.7.7

      - name: Run Bandit security scan
        run: |
          bandit -r . \
            --exclude ./tests,./migrations,./venv,./.github \
            -ll \
            --format json \
            -o bandit-report.json || true
          cat bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t campuspoll:${{ github.sha }} .

      - name: Verify Docker image starts
        run: |
          docker run -d --name test_container \
            -e ADMIN_PASSWORD=TestAdmin@123 \
            -e SECRET_KEY=ci-docker-test \
            -e MAIL_USERNAME='' \
            -p 5001:5000 \
            campuspoll:${{ github.sha }}
          sleep 8
          curl -f http://localhost:5001/health || (docker logs test_container && exit 1)
          docker stop test_container
