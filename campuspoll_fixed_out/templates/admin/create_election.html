{% extends "base.html" %}
{% block title %}Create Election - Admin{% endblock %}
{% block content %}
<div class="page-header">
    <a href="{{ url_for('admin.dashboard') }}" class="back-link">← Back to Dashboard</a>
    <h2>Create New Election</h2>
</div>

<div class="form-page" style="margin-top:0; max-width:600px;">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Election Title <span class="required">*</span></label>
            <input type="text" name="title" required placeholder="e.g. Student Council President 2024">
        </div>
        <div class="form-group">
            <label>Position <span class="required">*</span></label>
            <select name="position" required>
                <option value="">Select Position</option>
                <option>Student Council President</option>
                <option>Class Representative</option>
                <option>Cultural Secretary</option>
                <option>Sports Secretary</option>
                <option>Academic Secretary</option>
                <option>General Secretary</option>
                <option>Treasurer</option>
                <option>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" placeholder="Optional description of this election"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Nomination Start <span class="required">*</span></label>
                <input type="datetime-local" name="nomination_start" id="nomination_start" required>
            </div>
            <div class="form-group">
                <label>Nomination End <span class="required">*</span></label>
                <input type="datetime-local" name="nomination_end" id="nomination_end" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Voting Start <span class="required">*</span></label>
                <input type="datetime-local" name="voting_start" id="voting_start" required>
            </div>
            <div class="form-group">
                <label>Voting End <span class="required">*</span></label>
                <input type="datetime-local" name="voting_end" id="voting_end" required>
            </div>
        </div>
        <button type="submit" class="btn btn-full">Create Election</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
// Set minimum datetime to current local time and wire up cascading minimums
function toLocalDatetimeValue(d) {
    var off = d.getTimezoneOffset() * 60000;
    return new Date(d - off).toISOString().slice(0, 16);
}
var now = toLocalDatetimeValue(new Date());
['nomination_start','nomination_end','voting_start','voting_end'].forEach(function(id) {
    document.getElementById(id).min = now;
});
document.getElementById('nomination_start').addEventListener('change', function() {
    document.getElementById('nomination_end').min = this.value || now;
});
document.getElementById('nomination_end').addEventListener('change', function() {
    document.getElementById('voting_start').min = this.value || now;
});
document.getElementById('voting_start').addEventListener('change', function() {
    document.getElementById('voting_end').min = this.value || now;
});
</script>
{% endblock %}
