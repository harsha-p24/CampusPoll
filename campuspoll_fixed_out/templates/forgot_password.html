{% extends "base.html" %}
{% block title %}Forgot Password - CampusPoll{% endblock %}
{% block content %}
<div class="form-page">
    <h2>Forgot Password</h2>
    <p class="form-sub">Enter your registered email to reset your password</p>
    <form method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required aria-required="true" placeholder="your@college.edu">
        </div>
        <button type="submit" class="btn btn-full">Send Reset Link</button>
    </form>
    <p class="form-footer"><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
</div>
{% endblock %}
