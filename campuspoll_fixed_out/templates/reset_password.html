{% extends "base.html" %}
{% block title %}Reset Password - CampusPoll{% endblock %}
{% block content %}
<div class="form-page">
    <h2>Reset Password</h2>
    <p class="form-sub">Enter your new password below</p>
    <form method="POST">
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" required placeholder="Minimum 6 characters" minlength="6">
        </div>
        <button type="submit" class="btn btn-full">Reset Password</button>
    </form>
</div>
{% endblock %}
