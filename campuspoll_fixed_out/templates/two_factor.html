{% extends "base.html" %}
{% block title %}Two-Factor Authentication{% endblock %}
{% block content %}
<div class="form-page">
    <h2>Two-Factor Authentication</h2>
    <p class="form-sub">Enter the 6-digit code from your authenticator app</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Authentication Code</label>
            <input type="text" name="token" required placeholder="000000" maxlength="6"
                   pattern="[0-9]{6}" autocomplete="one-time-code" autofocus
                   style="letter-spacing:6px;font-size:20px;text-align:center;">
        </div>
        <button type="submit" class="btn btn-full">Verify</button>
    </form>
    <p class="form-footer"><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
</div>
{% endblock %}
